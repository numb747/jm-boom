name: Fork Build

# Builds Windows MSI and Linux deb for the fork without the upstream updater
# signing key. Release creation is done by hand from the uploaded artifacts.
on:
  push:
    branches:
      - fork-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            pkg-config \
            wget \
            xdg-utils

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build Tauri Windows MSI
        if: runner.os == 'Windows'
        run: bun run tauri build --bundles msi --config src-tauri/tauri.fork.conf.json

      - name: Build Tauri Linux deb
        if: runner.os == 'Linux'
        run: bun run tauri build --bundles deb --config src-tauri/tauri.fork.conf.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
